name: vrag

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TEXT_EMBED_MODEL: ${TEXT_EMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    ports:
      # Loopback by default
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      - models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    init: true
    command: ["sleep", "infinity"]
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ASR_ENABLED: ${ASR_ENABLED:-true}
      ASR_MODEL: ${ASR_MODEL:-small}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-}
      TEXT_EMBED_MODEL: ${TEXT_EMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      INDEX_ENABLED: ${INDEX_ENABLED:-true}
    volumes:
      - ./data:/data
      - models:/models

volumes:
  qdrant_storage:
  models:
