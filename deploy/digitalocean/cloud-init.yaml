#cloud-config
# Paste into the droplet's "User data" box after replacing the repo URL below.
package_update: true
packages:
  - git
runcmd:
  - export HOME=/root
  - git clone --depth 1 https://github.com/Khaledblel/multimodal-video-rag-engine.git /opt/vrag
  - bash /opt/vrag/deploy/digitalocean/bootstrap.sh
