# Gives the containers that run models access to the NVIDIA GPU. It is an addition to compose.yaml, used as
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
# or, for every later command as well, by putting this line in .env:
#   COMPOSE_FILE=compose.yaml:compose.gpu.yaml
# The host needs the NVIDIA driver and the NVIDIA Container Toolkit.
x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  worker:
    deploy: *gpu
  embedder:
    deploy: *gpu
  ollama:
    deploy: *gpu
